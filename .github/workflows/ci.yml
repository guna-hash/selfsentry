name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install pinned development environment
        run: python -m pip install -r requirements-dev.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Python tests (isolated services)
        run: python -m pytest tests/ -q
      - name: Lint
        run: python -m flake8 . --exclude=.git,.venv,venv,node_modules,state,dist,build --max-line-length=100
      - name: Scoped type checks
        run: python scripts/verify_types.py
      - name: Whitespace
        run: git diff --check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-dashboard/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
